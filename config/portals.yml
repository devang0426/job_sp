# ATS board tokens.
#
# Adding a company is a YAML edit — data, not code.
#
# Every token below was verified against its live board API and returned
# postings. A wrong token is not an error, it is a silently empty result,
# so re-verify before adding one:
#
#   greenhouse  curl https://boards-api.greenhouse.io/v1/boards/<token>/jobs
#   lever       curl "https://api.lever.co/v0/postings/<token>?mode=json"
#   ashby       curl https://api.ashbyhq.com/posting-api/job-board/<token>
#
# Large boards are capped per scan by MAX_JOBS_PER_BOARD in
# lib/sources/types.ts, newest postings first.

portals:
